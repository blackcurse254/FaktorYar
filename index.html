<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>فاکتوریار — فاکتورساز حرفه‌ای اصناف</title>
<meta name="description" content="فاکتورساز آفلاین برای اصناف ساختمانی — نقاشی، برق‌کاری، لوله‌کشی و بیشتر. تقویم جلالی، ذخیره‌سازی محلی، خروجی PDF.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="grain"></div>


<div class="rail-backdrop" id="railBackdrop"></div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark">ف</div>
      <div class="brand-text">
        <div class="display">فاکتوریار</div>
        <div class="dim">فاکتورساز اصناف</div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="rail-foot">
      <div class="eyebrow">پوسته</div>
      <div class="theme-switch">
        <button id="themeLight">روشن</button>
        <button id="themeDark">تیره</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <button class="btn btn-ghost rail-toggle" id="railToggle" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg> منو
    </button>

    <section class="view" id="view-dash"></section>
    <section class="view hidden" id="view-new"></section>
    <section class="view hidden" id="view-invoices"></section>
    <section class="view hidden" id="view-clients"></section>
    <section class="view hidden" id="view-catalog"></section>
    <section class="view hidden" id="view-settings"></section>
  </main>
</div>

<div id="toasts" class="toasts"></div>

<!-- Confirm dialog -->
<div class="overlay hidden" id="confirmOverlay">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><div class="card-title" id="confirmTitle">تأیید</div><button class="btn btn-ghost btn-icon" data-close="confirmOverlay">✕</button></div>
    <div class="modal-body"><p id="confirmBody" class="muted"></p></div>
    <div class="modal-foot"><button class="btn" data-close="confirmOverlay">انصراف</button><button class="btn btn-danger" id="confirmYes">تأیید و حذف</button></div>
  </div>
</div>

<!-- Client modal -->
<div class="overlay hidden" id="clientOverlay">
  <div class="modal">
    <div class="modal-head"><div class="card-title" id="clientModalTitle">مشتری جدید</div><button class="btn btn-ghost btn-icon" data-close="clientOverlay">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>نام مشتری</label><input class="input" id="cName" placeholder="مثلاً: آقای احمدی"></div>
      <div class="field-row">
        <div class="field"><label>شماره تماس</label><input class="input mono" id="cPhone" placeholder="۰۹۱۲..."></div>
      </div>
      <div class="field"><label>آدرس</label><textarea class="input" id="cAddress"></textarea></div>
      <div class="field"><label>یادداشت (اختیاری)</label><textarea class="input" id="cNote"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="clientOverlay">انصراف</button><button class="btn btn-primary" id="clientSaveBtn">ذخیره مشتری</button></div>
  </div>
</div>

<!-- Catalog item modal -->
<div class="overlay hidden" id="catalogOverlay">
  <div class="modal">
    <div class="modal-head"><div class="card-title" id="catModalTitle">قلم جدید</div><button class="btn btn-ghost btn-icon" data-close="catalogOverlay">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>شرح خدمت</label><input class="input" id="kName" placeholder="مثلاً: نصب کاشی دیوار"></div>
      <div class="field-row">
        <div class="field"><label>واحد</label><input class="input" id="kUnit" placeholder="متر مربع"></div>
        <div class="field"><label>قیمت (تومان)</label><input class="input num" id="kPrice" inputmode="numeric" placeholder="۰"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="catalogOverlay">انصراف</button><button class="btn btn-primary" id="catSaveBtn">ذخیره</button></div>
  </div>
</div>

<!-- Catalog picker (used from the new-invoice form) -->
<div class="overlay hidden" id="pickerOverlay">
  <div class="modal modal-lg">
    <div class="modal-head"><div class="card-title">افزودن از قیمت‌نامه</div><button class="btn btn-ghost btn-icon" data-close="pickerOverlay">✕</button></div>
    <div class="modal-body"><div id="pickerList"></div></div>
    <div class="modal-foot"><button class="btn" data-close="pickerOverlay">انصراف</button><button class="btn btn-primary" id="pickerAddBtn">افزودن انتخاب‌شده‌ها</button></div>
  </div>
</div>

<!-- Invoice preview / print / PDF -->
<div class="overlay hidden" id="previewOverlay">
  <div class="modal">
    <div class="modal-head"><div class="card-title" id="previewTitle">پیش‌نمایش فاکتور</div><button class="btn btn-ghost btn-icon" data-close="previewOverlay">✕</button></div>
    <div class="modal-body" style="padding:16px;background:var(--bg-sunk)">
      <div id="printArea"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="closePreviewBtn" data-close="previewOverlay">بستن</button>
      <button class="btn" id="printBtn"><svg viewBox="0 0 24 24"><path d="M6 9V3.5h12V9"/><rect x="4" y="9" width="16" height="8" rx="1.6"/><rect x="7" y="13.2" width="10" height="7.3" rx="0.8"/></svg> چاپ</button>
      <button class="btn btn-primary" id="pdfBtn"><svg viewBox="0 0 24 24"><path d="M12 3.5v12M7 11l5 5 5-5"/><path d="M4.5 19.5h15"/></svg> دانلود PDF</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
